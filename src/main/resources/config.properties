# Application under test (public demo banking site made for testing)
base.url=http://demo.testfire.net

# Browser: chrome | firefox | edge   (override: -Dbrowser=firefox)
browser=chrome
# Headless mode                        (override: -Dheadless=true)
headless=false

# Waits (seconds)
explicit.wait.seconds=15
short.wait.seconds=5
page.load.timeout.seconds=30

# Default valid user (used by tests that are not data-driven by user)
valid.username=admin
valid.password=admin

# Optional: if set, the "Electric Bill" debit amount must equal this exact text (e.g. $100.00)
expected.electric.bill.amount=

# Output folder for reports, screenshots and run history
report.dir=reports
